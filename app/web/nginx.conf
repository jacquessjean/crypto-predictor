server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this container; the api is reached by service name.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
