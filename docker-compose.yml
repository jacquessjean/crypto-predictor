name: crypto-predictor

services:
  web:
    build: ./app/web
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks: [front]

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    environment:
      MODEL_URL: http://model:8001  # POST /v1/predict
      DB_PATH: /app/appdata/predictions.db
    volumes:
      - api_data:/app/appdata
    depends_on:
      model:
        condition: service_healthy
    networks: [front, back]  # front: web + outbound internet; back: the model

  model:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      MODELS_ROOT: /models  # versions live here; current.json names the live one once a retrain is promoted
      MODEL_DIR: /models/v2  # the live model until the first promoted retrain
      BASE_DATA: /data/features.parquet
      RETRAIN_INTERVAL_HOURS: ${RETRAIN_INTERVAL_HOURS:-24}  # online learning: retrain on the feedback once a day
      MIN_NEW_FEEDBACK: ${MIN_NEW_FEEDBACK:-50}  # skip a retrain until this many new labeled samples arrived
    volumes:
      - ./out/model:/models  # read-write: the service stores feedback and writes new versions here
      - ./out/model/v1:/models/v1:ro  # the shipped models stay read-only: a retrain only ever adds v3, v4, ...
      - ./out/model/v2:/models/v2:ro
      - ./out/processed/features.parquet:/data/features.parquet:ro  # the training data (built by src/cleanup.py)
    networks: [back]
    restart: unless-stopped  # a retrain peaks near 4 GB; if Docker kills it for memory, the service comes back
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  front: {}
  back:
    internal: true  # no route to the host or the internet: only the api can reach the model

volumes:
  api_data: {}
